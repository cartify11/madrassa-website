name: Marketing Site CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Audit NPM dependencies
      run: npm audit --audit-level=high

    - name: Typecheck
      run: npm run typecheck

    - name: Build Next.js application
      run: npm run build

    - name: Secret and Token Scan
      run: |
        echo "Scanning repository for high-entropy secrets and credential tokens..."
        ! git grep -n -E '(AIza[0-9A-Za-z_-]{35}|ghp_[0-9A-Za-z]{36}|github_pat_[0-9A-Za-z_]{82}|sk_live_[0-9A-Za-z]{24}|AKIA[0-9A-Z]{16})' -- ':!.env.example'
